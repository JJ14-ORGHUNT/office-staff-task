<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Staff Task Management</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 800px;
      width: 100%;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      text-align: center;
    }
    .staff-list {
      list-style: none;
    }
    .staff-item {
      background: #f5f5f5;
      border-left: 4px solid #667eea;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 5px;
      transition: transform 0.2s;
    }
    .staff-item:hover {
      transform: translateX(5px);
    }
    .staff-name {
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }
    .staff-position {
      color: #666;
      font-size: 14px;
    }
    .loading {
      text-align: center;
      color: #667eea;
    }
    .error {
      background: #fee;
      color: #c00;
      padding: 15px;
      border-radius: 5px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 Office Staff Task Management</h1>
    <div id="content">
      <div class="loading">Loading staff data...</div>
    </div>
  </div>

  <script>
    async function loadStaff() {
      try {
        const response = await fetch('/staff');
        const data = await response.json();
        
        const html = `
          <ul class="staff-list">
            ${data.staff.map(person => `
              <li class="staff-item">
                <div class="staff-name">${person.name}</div>
                <div class="staff-position">${person.position}</div>
              </li>
            `).join('')}
          </ul>
        `;
        
        document.getElementById('content').innerHTML = html;
      } catch (error) {
        document.getElementById('content').innerHTML = `
          <div class="error">Error loading staff data: ${error.message}</div>
        `;
      }
    }

    loadStaff();
  </script>
</body>
</html>
